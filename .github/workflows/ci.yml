name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: posted
          POSTGRES_USER: posted
          POSTGRES_PASSWORD: disposable-ci-database-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U posted -d posted" --health-interval 5s --health-timeout 5s --health-retries 12
      storage:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: posted-local-fixture
          RUSTFS_SECRET_KEY: posted-disposable-storage-passphrase
          RUSTFS_CONSOLE_ENABLE: "false"
        ports: ["55491:9000"]
        options: --tmpfs /data:rw,uid=10001,gid=10001 --tmpfs /logs:rw,uid=10001,gid=10001
    env:
      DATABASE_URL: postgres://posted:disposable-ci-database-password@127.0.0.1:5432/posted
      POSTED_WEB_URL: http://localhost:4342
      POSTED_API_URL: http://localhost:4341
      POSTED_SECRET: disposable-ci-secret-not-for-production-000000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check && pnpm docs:validate
  production:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Verify a disposable production installation and restore
        env:
          POSTED_VERIFY_EXPECT_ARCH: ${{ matrix.architecture }}
        run: node tools/production-verify.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: production-${{ matrix.architecture }}
          path: tmp/verification/
          if-no-files-found: warn
          retention-days: 14
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
  required-ci:
    name: Required CI
    if: always()
    needs: [verify, documentation, production, security]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for(const [name,job] of Object.entries(JSON.parse(process.env.RESULTS))) if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}'
