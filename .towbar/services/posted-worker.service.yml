id: posted-worker
name: Posted Worker
description: Posted v0.1.0 worker from the published immutable release image.
deployment:
  type: image
  image: ghcr.io/avgeek-oss/posted-worker@sha256:56f6d2843682c30b5c6a847fb6183386fd98bff0cdc3c3c156f093f47934bf39
autoDeploy: false
container:
  network: posted
  port: 4343
  resources:
    cpus: 0.5
    memory: 1g
health:
  path: /health/ready
  timeoutSeconds: 180
secrets:
  runtime:
    - NODE_ENV
    - DATABASE_URL
    - POSTED_SECRET
    - POSTED_WEB_URL
    - POSTED_API_URL
environments:
  production:
    server: 13.206.149.158
