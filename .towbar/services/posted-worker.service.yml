id: posted-worker
name: Posted Worker
description: Posted v0.2.0 worker from the published immutable release image.
deployment:
  type: image
  image: ghcr.io/avgeek-oss/posted-worker@sha256:9e6b3af02cbb9819a36eadfc43f0d0ec9e8f48d03781eb10052fc4d881ddd1ae
autoDeploy: false
container:
  network: posted
  port: 4343
  resources:
    cpus: 0.5
    memory: 1g
health:
  path: /health/ready
  timeoutSeconds: 180
secrets:
  runtime:
    - NODE_ENV
    - DATABASE_URL
    - POSTED_SECRET
    - POSTED_WEB_URL
    - POSTED_API_URL
    # Keep provider values identical in API and Worker.
    - POSTED_X_CLIENT_ID
    - POSTED_X_CLIENT_SECRET
    - POSTED_LINKEDIN_CLIENT_ID
    - POSTED_LINKEDIN_CLIENT_SECRET
    - POSTED_LINKEDIN_API_VERSION
    - POSTED_THREADS_CLIENT_ID
    - POSTED_THREADS_CLIENT_SECRET
    - POSTED_BLUESKY_CLIENT_ID
    - POSTED_BLUESKY_PRIVATE_KEY_JWK
environments:
  production:
    server: 13.206.149.158
