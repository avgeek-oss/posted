id: posted-web
name: Posted UI
description: Posted v0.2.0 web from the published immutable release image.
deployment:
  type: image
  image: ghcr.io/avgeek-oss/posted-web@sha256:cc0181c2f4f2d8ef01e82eb04395c43bcd82815e8b4523594c8e394fe1ebf1fd
autoDeploy: false
container:
  network: posted
  port: 4342
  resources:
    cpus: 0.25
    memory: 256m
health:
  path: /health/ready
  timeoutSeconds: 180
secrets:
  runtime:
    - NODE_ENV
    - POSTED_API_URL
environments:
  production:
    server: 13.206.149.158
domains:
  primary: posted.avgeek.ltd
tls:
  mode: cloudflare-dns
  proxied: false
