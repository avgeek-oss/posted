id: posted-api
name: Posted API
description: Posted v0.2.0 api from the published immutable release image.
deployment:
  type: image
  image: ghcr.io/avgeek-oss/posted-api@sha256:3a1ac56429a6bd094d989936e8f65ed93d869450767a84913c5229830c089053
autoDeploy: false
container:
  network: posted
  port: 4341
  resources:
    cpus: 0.5
    memory: 512m
health:
  path: /health/ready
  timeoutSeconds: 180
secrets:
  runtime:
    - NODE_ENV
    - DATABASE_URL
    - POSTED_SECRET
    - POSTED_WEB_URL
    - POSTED_API_URL
    # Add optional provider credentials to both API and Worker runtime secrets when enabled.
    - POSTED_SMTP_HOST
    - POSTED_SMTP_PORT
    - POSTED_SMTP_SECURE
    - POSTED_SMTP_USER
    - POSTED_SMTP_PASSWORD
    - POSTED_SMTP_FROM
environments:
  production:
    server: 13.206.149.158
domains:
  primary: posted-api.avgeek.ltd
tls:
  mode: cloudflare-dns
  proxied: false
