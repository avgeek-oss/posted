id: posted-api
name: Posted API
description: Posted v0.1.0 api from the published immutable release image.
deployment:
  type: image
  image: ghcr.io/avgeek-oss/posted-api@sha256:6f44ed19a2a9c584dfd2b6724f23032925a45ccdb777aef2dbd0f6d58d05caa4
autoDeploy: false
container:
  network: posted
  port: 4341
  resources:
    cpus: 0.5
    memory: 512m
health:
  path: /health/ready
  timeoutSeconds: 180
secrets:
  runtime:
    - NODE_ENV
    - DATABASE_URL
    - POSTED_SECRET
    - POSTED_WEB_URL
    - POSTED_API_URL
    - POSTED_SMTP_HOST
    - POSTED_SMTP_PORT
    - POSTED_SMTP_SECURE
    - POSTED_SMTP_USER
    - POSTED_SMTP_PASSWORD
    - POSTED_SMTP_FROM
environments:
  production:
    server: 13.206.149.158
domains:
  primary: posted-api.avgeek.ltd
tls:
  mode: cloudflare-dns
  proxied: false
